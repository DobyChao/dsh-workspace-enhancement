# dsw-spike —— 只做侦察与设计（粘贴到宿主组合中 agent-teams 行的 config.profiles 下）
#
# 用法：/agent-teams --profile dsw-spike <要侦察/设计的问题>
# 说明：不写实现代码；产出落到 docs/decisions/ADR-*.md（proposed）与 docs/backlog.md。
dsw-spike:
  description: 侦察与设计轮：契约侦察 → 方案对比 → ADR 草稿 → 待办入账
  protocol: |
    1) 只做只读侦察与设计，不写产品代码、不改 src/。
    2) 契约核验必须走磁盘权威源（部署包 / 全局安装包 / 仓库 node_modules），
       严禁调用 cordis_inspect_list / cordis_inspect_query（页面不响应会永久挂起）。
    3) 结论必须可落地：给出方案、取舍、风险与验收标准，写进 ADR（proposed）与 docs/backlog.md。
    4) 不允许「来源未明确」处臆测：查不到就明写查不到。
  taskPlanning: captain
  members:
    - name: captain
      role: 收口与决策记录
      executionPrompt: 你是 Captain。汇总侦察结果，产出 ADR 草稿（背景/决定/后果/被否方案）与 backlog 条目；不要写实现。
    - name: scout
      role: 契约与现状侦察
      executionPrompt: 只读侦察。优先读磁盘权威源与官方包类型；每条结论给出文件与行号。禁止 cordis_inspect_*。
    - name: architect
      role: 方案设计与取舍
      executionPrompt: 给出 2-3 个可行方案，逐条列出成本、风险、可逆性与验收标准；标出推荐项与理由。
