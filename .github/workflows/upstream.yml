name: Upstream drift

# Sentinel for "the host moved and nobody told us".
#
# @deepseek-ai/dsh ships fast with no changelog and no public issue tracker, so
# this job is the notification channel: it reinstalls the seam packages from a
# published dist-tag and runs the gate against them.
#
# Two channels are probed on purpose:
#   next  — the rc family our peers anchor. Red means the family we already
#           claim to support moved: look now. (Resolves to 0.1.5-rc.2 as of
#           2026-09-11 — the line that added `FileSystem.readByteRange`
#           (UPSTREAM-1) and moved the Connection seam (UPSTREAM-3).)
#   alpha — the NEXT generation (0.1.5-alpha.x at the time of writing; it already
#           pulls packages we do not depend on, e.g. @deepseek-ai/dsh-brand and
#           @deepseek-ai/dsh-invariants). Alpha is where seam breaks land first;
#           when alpha content is promoted to rc our plugin must already be
#           adapted. A red alpha run is an EARLY WARNING with a longer fuse, not
#           a merge blocker — but it opens/updates an issue so it cannot be
#           missed. See docs/compatibility.md.
#
# The `legacy` channel (0.1.2-rc.1, the family the 3080 deployment used to run)
# was REMOVED on 2026-09-11 by owner decision: the plugin no longer claims any
# 0.1.2 support (the 0.1.5 line moved the Connection seam and the slot catalogue),
# so the peer range is a single family and one row would be a fiction.
on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC — next + alpha
    - cron: '0 3 * * 4' # Thursday 03:00 UTC — alpha gets its own slot
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # UPSTREAM-7: the drift channels below only reinstall the seam family this
  # repo DECLARES, so a green channel says nothing about packages we do not
  # depend on — the 0.1.6 line shipped a whole official SSH runtime family
  # that way (ADR-0026 §5). This job diffs the @deepseek-ai composition of the
  # host packages (dsh / dsh-web-app, per dist-tag) against the committed
  # baseline (`scripts/upstream-baseline.json`) and opens an issue on any
  # addition/removal, with the SSH four-pack called out as the UPSTREAM-6
  # reevaluation trigger. Acknowledging = regenerate the baseline, commit.
  # Weekly (rides the Monday next+alpha slot); manual dispatch also runs it.
  scope-watch:
    name: scope watch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 1'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Watch the @deepseek-ai host composition
        id: watch
        run: node scripts/upstream-watch.mjs

      - name: Open or update the scope-watch issue
        if: steps.watch.outputs.signal == 'changed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const title = '[upstream watch] the @deepseek-ai host composition changed'
            const body = [
              fs.readFileSync('.tmp/upstream-watch-report.md', 'utf8'),
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This is the scope watch (UPSTREAM-7): the drift channels only reinstall the seam family this repo declares, so capability packages outside that list arrive silently unless this check rings.',
              '',
              'See `docs/compatibility.md` §3.1 and `docs/decisions/ADR-0026-upstream-ssh-runtime.md` §5.',
            ].join('\n')
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            })
            const existing = open.find(issue => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              })
            }

  drift:
    name: drift (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version extraction takes the LAST whitespace token of `npm view`'s last line
          # and strips quotes: npm >= 11 prints multi-match output as `name@ver 'ver'`
          # (both forms, sometimes on one line) — a bare `tail -1` yielded a spec
          # fragment that broke `npm install` (2026-09-25: dsh-code-runtime mangled
          # into `pkg@scope/pkg@0.1.5-rc.3 '0.1.5-rc.3'` → 404 → boot smoke died).
# `tag:` resolves every host-shared package through a dist-tag; `family:`
        # pins them all to one exact version.
        include:
          - channel: next
            tag: next
            family: ''
          - channel: alpha
            tag: alpha
            family: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (pinned family)
        run: npm ci

      - name: Print pinned family
        run: |
          node -e "const p=require('./package.json');console.log(Object.entries({...p.peerDependencies,...p.devDependencies}).filter(([n])=>n.startsWith('@deepseek-ai/dsh-')).map(([n,v])=>n+'@'+v).join('\n'))"

      - name: Install the '${{ matrix.channel }}' seam family
        id: family
        # --legacy-peer-deps: the probe deliberately installs a family that our
        # peer ranges may not satisfy (alpha), or an older one than the dev deps
        # resolve (legacy); npm would otherwise refuse with ERESOLVE.
        run: |
          set -o pipefail
          PKGS=""
          NAMES="$(node -e "console.log(Object.keys(require('./package.json').peerDependencies).filter(n=>n.startsWith('@deepseek-ai/dsh-')).join(' '))")"
          if [ -n "${{ matrix.family }}" ]; then
            for name in $NAMES; do
              v="$(npm view "$name@${{ matrix.family }}" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
              if [ -n "$v" ]; then
                PKGS="$PKGS $name@$v"
              else
                echo "::warning::$name has no ${{ matrix.family }} release — skipped"
              fi
            done
          else
            for name in $NAMES; do
              v="$(npm view "$name@${{ matrix.tag }}" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
              if [ -n "$v" ]; then
                PKGS="$PKGS $name@$v"
              else
                echo "::warning::$name has no '${{ matrix.tag }}' tag — skipped"
              fi
            done
          fi
          echo "family=$PKGS" >> "$GITHUB_OUTPUT"
          echo "installing:$PKGS"
          npm install --no-save --legacy-peer-deps $PKGS 2>&1 | tail -25

          # Second pass — the family's OWN requirements. Our peer list is not the
          # whole family: 0.1.5's dsh-subprocess declares @deepseek-ai/dsh-http-proxy
          # as a PEER, and `--legacy-peer-deps` (needed to install a family our
          # ranges may not satisfy) deliberately skips auto-installing peers — so
          # it was never installed and three suites died with
          # ERR_MODULE_NOT_FOUND before reaching any assertion. Whatever the
          # installed family itself requires must resolve through the same channel.
          WANT="${{ matrix.family }}"
          if [ -z "$WANT" ]; then WANT="${{ matrix.tag }}"; fi
          MISSING="$(node -e "
            const fs = require('fs');
            const peers = Object.keys(require('./package.json').peerDependencies).filter((n) => n.startsWith('@deepseek-ai/dsh-'));
            const out = new Set();
            for (const name of peers) {
              let manifest;
              try { manifest = JSON.parse(fs.readFileSync('node_modules/' + name + '/package.json', 'utf8')); } catch { continue; }
              for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
                for (const dep of Object.keys(manifest[field] ?? {})) {
                  if (!dep.startsWith('@deepseek-ai/')) continue;
                  if (!fs.existsSync('node_modules/' + dep + '/package.json')) out.add(dep);
                }
              }
            }
            console.log([...out].join(' '));
          ")"
          if [ -n "$MISSING" ]; then
            DEPS=""
            for dep in $MISSING; do
              v="$(npm view "$dep@$WANT" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
              if [ -n "$v" ]; then DEPS="$DEPS $dep@$v"; fi
            done
            if [ -n "$DEPS" ]; then
              echo "family closure:$DEPS"
              # Reinstall the family specs TOGETHER with the closure: every
              # `npm install --no-save <specs>` reifies the whole tree from
              # package.json, so a closure-only install silently reverts the
              # channel family back to the lockfile's (the 2026-09-15 alpha run
              # installed 0.1.6-alpha.1 and this step swapped it back to rc.2).
              npm install --no-save --legacy-peer-deps $PKGS $DEPS 2>&1 | tail -10
            else
              echo "::warning::family closure needed but unresolved on '$WANT': $MISSING"
            fi
          fi
          # Diagnostics: a family member's own dependencies are exactly what a
          # probe must not silently get wrong (this is what hid the 0.1.5
          # dsh-http-proxy gap behind three unrelated-looking suite failures).
          echo "closure probe: want=$WANT missing=[$MISSING]"
          ls node_modules/@deepseek-ai | sort | tr '\n' ' ' | head -c 900; echo
          node -e "for (const n of ['@deepseek-ai/dsh-http-proxy']) { try { console.log(n + ' -> ' + require.resolve(n + '/package.json')) } catch { console.log(n + ' -> UNRESOLVED') } }" || true

      - name: Print resolved family
        # The anchor assertion exists because `npm install | tail` once swallowed
        # a failed alpha install: the 2026-09-14 run (34824542756) kept testing
        # rc.2 on the alpha job while claiming to probe alpha. Fail loudly when
        # the channel did not take effect on the family anchor.
        run: |
          node -e "for (const n of Object.keys(require('./package.json').peerDependencies).filter(n=>n.startsWith('@deepseek-ai/dsh-'))) { try { console.log('  '+n+'@'+require('./node_modules/'+n+'/package.json').version) } catch { console.log('  '+n+'@MISSING') } }"
          WANT="${{ matrix.family }}"
          if [ -z "$WANT" ]; then WANT="${{ matrix.tag }}"; fi
          ANCHOR="$(node -e "try { console.log(require('./node_modules/@deepseek-ai/dsh-fs/package.json').version) } catch { console.log('') }")"
          WANT_V="$(npm view "@deepseek-ai/dsh-fs@$WANT" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
          if [ -z "$WANT_V" ]; then
            echo "::warning::@deepseek-ai/dsh-fs has no '$WANT' release — family anchor not verified"
          elif [ "$ANCHOR" != "$WANT_V" ]; then
            echo "::error::family anchor resolved to '${ANCHOR:-MISSING}' but channel '$WANT' publishes '$WANT_V' — the channel install never took effect"
            exit 1
          fi

      - name: Typecheck against the '${{ matrix.channel }}' host
        run: npm run typecheck

      - name: Unit suite against the '${{ matrix.channel }}' host
        run: npm test

      - name: Family / gate check (this is the drift signal)
        run: npm run check:static

      # `lib/` is a build product and is not committed, so the smoke needs it.
      - name: Build the row for the boot smoke
        run: npm run build

      # The gates above stop at "it compiles against the family" — they never
      # load a host, which is why the 0.1.5 line could fail at BOOT (the
      # `/dsw` mount reading `owner.webServer` on a context without it) while
      # every static gate stayed green: `dsh-workspace-enhancement/web` took the
      # whole plugin tree down with `cannot get property "webServer" without
      # inject`. This step boots the REAL host of the channel against a throwaway
      # DSH_HOME and asserts the surface the row must provide.
      - name: Boot smoke — the row must survive a real host (${{ matrix.channel }})
        run: |
          set -o pipefail
          WANT="${{ matrix.family }}"
          if [ -z "$WANT" ]; then WANT="${{ matrix.tag }}"; fi
          HOST="$(npm view "@deepseek-ai/dsh@$WANT" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
          if [ -z "$HOST" ]; then
            echo "::warning::@deepseek-ai/dsh has no release on '$WANT' — boot smoke skipped"
            exit 0
          fi
          echo "boot host: @deepseek-ai/dsh@$HOST"
          npm install --no-save --legacy-peer-deps "@deepseek-ai/dsh@$HOST" 2>&1 | tail -5
          ls node_modules/@deepseek-ai/dsh/lib/bin.js
          # --legacy-peer-deps above is required (the repo's dev tree may sit on a
          # different family than the channel; plain resolution would ERESOLVE),
          # but it also skips the CLI's OWN peers — and @deepseek-ai/dsh-app-boot
          # imports its peer @deepseek-ai/cordis-plugin-group at boot, which no
          # regular dependency carries. Without this closure the host died with
          # ERR_MODULE_NOT_FOUND before printing its URL on BOTH channels
          # (2026-09-14 run 34824542756, issues #7/#9) and none of the smoke's
          # assertions ever ran. Close the CLI tree's @deepseek-ai/* graph in a
          # fixpoint loop that pins EVERY walked dep to an explicit spec (channel
          # tag first, but the requirer's declared range wins when the channel
          # pin is stale) — not just the ABSENT ones: the repo's own lockfile
          # leaves @deepseek-ai packages of the older family in node_modules,
          # and a 0.1.7 persistence plugin meeting a 0.1.5 Session died at boot
          # with "format catalog v4 does not match Session v3" (2026-09-25,
          # drift next). Termination keys on the resolved spec set stabilizing,
          # and the UNION of every spec so far is always installed — a later
          # `npm install --no-save <subset>` reifies the tree from package.json
          # and would revert the unnamed ones back to the lockfile.
          ALLDEPS="@deepseek-ai/dsh@$HOST"
          for round in 1 2 3; do
            WANTLIST="$(node -e '
              const fs = require("fs");
              const seen = new Set(["@deepseek-ai/dsh"]);
              const queue = ["@deepseek-ai/dsh"];
              const out = new Map();
              while (queue.length) {
                const name = queue.shift();
                let manifest;
                try { manifest = JSON.parse(fs.readFileSync("node_modules/" + name + "/package.json", "utf8")); } catch { continue; }
                // optionalDependencies are deliberately NOT closed: the native
                // node-addon-system-* platform binaries are optional on purpose,
                // and force-installing a foreign-platform one dies with
                // EBADPLATFORM (2026-09-15, first rerun of this step).
                for (const field of ["dependencies", "peerDependencies"]) {
                  const block = manifest[field] ?? {};
                  for (const dep of Object.keys(block)) {
                    if (!dep.startsWith("@deepseek-ai/")) continue;
                    if (!out.has(dep)) out.set(dep, block[dep]);
                    if (!seen.has(dep) && fs.existsSync("node_modules/" + dep + "/package.json")) { seen.add(dep); queue.push(dep); }
                  }
                }
              }
              console.log([...out].map(([dep, range]) => dep + "|" + range).join("\n"));
            ')"
            NEW=""
            UNRESOLVED=""
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              dep="${entry%%|*}"; range="${entry#*|}"
              # Channel tag first, but the REQUIRER's declared range wins when
              # the channel pin does not satisfy it: cordis-* peers live on
              # independent version lines whose next tag can trail the release
              # app-boot needs (@deepseek-ai/cordis-plugin-group: next=1.0.1-rc.4
              # vs required ^1.0.2, latest=1.0.2 — 2026-09-15).
              v="$(npm view "$dep@$WANT" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
              if [ -n "$range" ] && [ -n "$v" ]; then
                sat="$(npm view "$dep@$range" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"
                if [ -n "$sat" ] && [ "$sat" != "$v" ]; then v="$sat"; fi
              fi
              if [ -z "$v" ]; then v="$(npm view "$dep" version 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d "'" | sed -E 's/.*@//' || true)"; fi
              if [ -n "$v" ]; then
                # Already-pinned specs are skipped; everything else — missing OR
                # present at a stale version — gets an explicit pin this round.
                case " $ALLDEPS " in *" $dep@$v "*) ;; *) NEW="$NEW $dep@$v";; esac
              else
                UNRESOLVED="$UNRESOLVED $dep@$range"
              fi
            done <<< "$WANTLIST"
            if [ -z "$NEW" ]; then break; fi
            if [ -n "$UNRESOLVED" ]; then
              echo "::error::boot smoke cannot resolve CLI deps/peers on '$WANT':$UNRESOLVED"
              exit 1
            fi
            echo "boot closure (round $round):$NEW"
            # Union install, same reason as the seam-family closure: an install
            # naming only this round's deps would revert every earlier
            # --no-save spec (the CLI itself included) back to the lockfile.
            ALLDEPS="$ALLDEPS$NEW"
            npm install --no-save --legacy-peer-deps $ALLDEPS 2>&1 | tail -10
          done
          # Strict on EVERY channel: the plugin's channel is a set of exact Fetch
          # routes below the supported `/api` seam, so a 404/405 here is a
          # regression, not a tracked upstream break. (`--channel-warn`, the old
          # escape hatch for the 0.1.5 `/dsw` break, is gone with UPSTREAM-3.)
          node scripts/boot-smoke.mjs --cli node_modules/@deepseek-ai/dsh/lib/bin.js

      - name: Open or update the drift issue
        if: failure()
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ matrix.channel }}
          FAMILY: ${{ steps.family.outputs.family }}
        with:
          script: |
            const channel = process.env.CHANNEL
            const title = `[upstream drift] the '${channel}' seam family moved`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The \`${channel}\` probe failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `Run: ${runUrl}`,
              '',
              `Resolved family:`,
              '',
              '```',
              process.env.FAMILY || '(see the run log)',
              '```',
              '',
              channel === 'alpha'
                ? 'This is the EARLY WARNING channel: alpha content will be promoted to rc, so a break here becomes a break we must fix before the next rc bump.'
                : 'This is the family our peers already anchor — the break is live.',
              '',
              'See `docs/compatibility.md`.',
            ].join('\n')
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            })
            const existing = open.find(issue => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              })
            }
