name: CI

# The single quality gate. Everything here is `npm run check` — the same command
# a human or an agent runs locally, so a green CI means the local gate is green
# too (see docs/testing.md for why that matters).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser E2E suite against a booted lab instance
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          # The plugin is developed and deployed on Windows: placeholder path
          # parsing, the DPAPI keychain and the PowerShell audit cases only exist
          # there. Ubuntu is the cross-platform check, Windows the real target.
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Conventional-Commit gate reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: core/go.mod

      - name: Install
        run: npm ci

      - name: Go core (test + linux/amd64 build)
        if: runner.os == 'Linux'
        working-directory: core
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/dsh-core .

      - name: Go core (unit tests, no jail)
        if: runner.os != 'Linux'
        working-directory: core
        run: go test ./...

      - name: Gate (static + typecheck + unit + build + pack smoke)
        run: npm run check

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:coverage -- --test-reporter=dot
        continue-on-error: true

  pr-title:
    name: PR title (squash subject)
    # A squash merge uses the PR TITLE as the commit subject on master, and the
    # static gate validates that subject. Without this job a bad title only
    # shows up after the merge, when master is already red.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|docs|test|chore|refactor|perf|build|ci|revert)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "ok: $PR_TITLE"
            exit 0
          fi
          echo "::error::PR title must be a Conventional Commit subject — a squash merge turns it into the commit subject on master."
          echo "got: $PR_TITLE"
          echo "example: fix(side-workspaces): keep the read-only gate under junction spellings"
          exit 1

  e2e-l1:
    name: e2e-l1 (L1 smoke, headless)
    # INFRA-23: matrix.md §3 M3–M5 as DETERMINISTIC process-level assertions on
    # every PR. The LLM is a scripted fake Anthropic Messages server
    # (scripts/e2e-l1/fake-model.mjs); the host is the real `dsh` (0.2.0 family,
    # pinned) running the real agent loop through dsh-headless against a
    # services-container sshd target — the only layer the UPSTREAM-8 breaks hid
    # from every fabricated test double. M6/M7's browser halves stay in the
    # manual e2e job below.
    # The ssh credential is a throwaway container password held in the
    # DSW_E2E_SSH_PASSWORD repo secret (owner creates it once); until it exists
    # the job self-skips with a notice instead of failing.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          PASSWORD_ACCESS: 'true'
          USER_NAME: e2essh
          USER_PASSWORD: ${{ secrets.DSW_E2E_SSH_PASSWORD }}
        ports:
          - 2222:2222
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run the L1 process-level cases (M3–M5)
        env:
          DSW_E2E_SSH_PASSWORD: ${{ secrets.DSW_E2E_SSH_PASSWORD }}
        run: |
          if [ -z "$DSW_E2E_SSH_PASSWORD" ]; then
            echo "::notice::DSW_E2E_SSH_PASSWORD is not configured — e2e-l1 self-skips. The repo owner creates this secret once (a throwaway password for the per-run sshd container); see docs/testing.md."
            exit 0
          fi
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && break
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null || { echo "::error::sshd service container never listened on 2222"; exit 1; }
          npm ci
          npm run build
          npm i -g @deepseek-ai/dsh@0.2.0-rc.2
          CLI="$(npm root -g)/@deepseek-ai/dsh/lib/bin.js"
          node scripts/e2e-l1/run-cases.mjs \
            --cli "$CLI" \
            --host 127.0.0.1 --port 2222 --username e2essh \
            --password "$DSW_E2E_SSH_PASSWORD" \
            --workspace /home/e2essh

  e2e:
    name: e2e (lab, manual)
    # Manual only: the browser suite needs a live DSH lab instance. Run it with
    # `gh workflow run CI -f e2e=true`, or locally via `npm run e2e`.
    if: github.event_name == 'workflow_dispatch' && inputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Boot isolated lab
        run: |
          npm i -g @deepseek-ai/dsh
          export DSH_HOME="$HOME/.dsh-lab"
          mkdir -p "$DSH_HOME"
          dsh plugin --profile web add "$PWD"
          nohup dsh web --port 50599 --no-open > /tmp/lab.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:50599/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          curl -s -o /dev/null -w 'lab http %{http_code}\n' http://127.0.0.1:50599/

      - name: Playwright
        env:
          DSW_E2E_BASE_URL: http://127.0.0.1:50599
        run: npm run e2e

      - name: Lab log
        if: always()
        run: tail -80 /tmp/lab.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
