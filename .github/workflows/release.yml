name: Release

# Publishes to npm with OIDC trusted publishing: the npm CLI exchanges this
# workflow's GitHub OIDC token for a short-lived publish credential, so there is
# no NPM_TOKEN secret and no interactive 2FA / passkey anywhere in the loop.
#
# One-time setup (repository owner, on npmjs.com): package -> Settings ->
# Trusted Publisher -> GitHub Actions, with
#   owner      DobyChao
#   repository dsh-workspace-enhancement
#   workflow   release.yml
#
# Cutting a release then means: bump the version in a merged PR, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# After `npm publish` succeeds, the same job creates the GitHub Release for
# that tag. Release notes are generated by Actions. npm still uses Trusted
# Publishing (OIDC) plus a human Approve on the `npm-publish` environment —
# the Release step does not bypass that gate.
on:
  push:
    tags: ['v*']

permissions:
  # contents: write — create the GitHub Release after npm publish. Notes are
  # generated by Actions (`gh release create --generate-notes`).
  # id-token: write — npm Trusted Publishing (OIDC). Kept alongside contents
  # write; the `npm-publish` environment Approve gate is unchanged.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The owner's explicit release decision: a tag only QUEUES this job. The
    # job waits on the `npm-publish` environment until the required reviewer
    # (the repository owner) approves it in the Actions UI, so nothing reaches
    # the registry without a human click. The GitHub Release is created only
    # after that Approve and a successful `npm publish`.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # INFRA-15 / REQ-I26: `npm run check` (prepublishOnly) builds the
      # linux-x64 and linux-arm64 core tarballs; pack-smoke hard-requires both.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: core/go.mod

      - name: The npm CLI must support trusted publishing (>= 11.5.1)
        run: |
          npm --version
          node -e "const [maj, min] = require('node:child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5)) { console.error('npm >= 11.5.1 is required for trusted publishing'); process.exit(1) }"

      - name: The tag must match package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME package.json=$PKG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $GITHUB_REF_NAME does not match the package.json version $PKG"; exit 1; }

      - name: Print the OIDC identity npm will see
        # Diagnostics: when the registry answers "OIDC permission denied for
        # this action", compare these claims field by field with the package's
        # Trusted Publisher entry on npmjs.com.
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let raw='';process.stdin.on('data',c=>raw+=c).on('end',()=>{const claims=JSON.parse(Buffer.from(JSON.parse(raw).value.split('.')[1],'base64url').toString());for (const k of ['iss','aud','sub','repository','repository_owner','workflow_ref','job_workflow_ref','ref','environment','event_name']) console.log(k + ' = ' + (claims[k] ?? '(absent)'));})"

      - run: npm ci

      - name: Trust core binaries shipped by earlier releases
        run: node scripts/inherit-published-core-hashes.mjs

      - name: Quality gate (npm publish also re-runs prepublishOnly)
        run: npm run check

      - run: npm publish --access public

      # GitHub Release notes are generated by Actions. npm still uses Trusted
      # Publishing (OIDC) and a human Approve on the `npm-publish` environment;
      # this step runs only after `npm publish` succeeds. Idempotent: a Release
      # that already exists for this tag (for example v0.2.7, created by hand)
      # is left as-is so a re-run does not fail the job.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release for $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          if ! gh release create "$GITHUB_REF_NAME" --generate-notes --latest; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "GitHub Release for $GITHUB_REF_NAME already exists; skipping."
              exit 0
            fi
            exit 1
          fi
